name: Build Android APK with GStreamer

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build GStreamer Android APK
    runs-on: ubuntu-latest

    env:
      GST_VERSION: "1.28.8"
      NDK_VERSION: "26.3.11579264"
      GST_SDK_DIR: "/home/runner/gstreamer-android"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install Android NDK and CMake
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Installing NDK ${{ env.NDK_VERSION }} and CMake 3.22.1..."
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: Restore GStreamer Android SDK Cache
        id: cache-gstreamer
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.GST_SDK_DIR }}
          key: gstreamer-android-${{ env.GST_VERSION }}-universal-v2

      - name: Download and unpack GStreamer Android SDK
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        run: |
          mkdir -p ${{ env.GST_SDK_DIR }}
          echo "Downloading GStreamer ${{ env.GST_VERSION }} Android universal SDK..."
          curl -fL --retry 3 --connect-timeout 30 -o /tmp/gstreamer-android.tar.xz \
            https://gstreamer.freedesktop.org/data/pkg/android/${{ env.GST_VERSION }}/gstreamer-1.0-android-universal-${{ env.GST_VERSION }}.tar.xz
          echo "Unpacking GStreamer SDK..."
          tar -xf /tmp/gstreamer-android.tar.xz -C ${{ env.GST_SDK_DIR }}
          rm -f /tmp/gstreamer-android.tar.xz

      - name: Patch GStreamer NDK tools.mk for Clang linker
        run: |
          echo "Patching tools.mk in GStreamer SDK to correctly format linker library flags..."
          find ${{ env.GST_SDK_DIR }} -name "tools.mk" -exec sed -i 's/\$(eval __libtool.link.shared_libs += \$1)/\$(eval __libtool.link.shared_libs += -l\$(patsubst -l%,%,\$1))/' {} +
          
          # Ensure stub libgstrsworkspace.a exists if referenced by Rust workspace .la files
          for arch in arm64 armv7 x86 x86_64; do
            if [ -d "${{ env.GST_SDK_DIR }}/$arch/lib" ] && [ ! -f "${{ env.GST_SDK_DIR }}/$arch/lib/libgstrsworkspace.a" ]; then
              echo "Creating stub libgstrsworkspace.a for $arch"
              ar cr "${{ env.GST_SDK_DIR }}/$arch/lib/libgstrsworkspace.a"
            fi
          done

      - name: Save GStreamer Cache Immediately
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.GST_SDK_DIR }}
          key: gstreamer-android-${{ env.GST_VERSION }}-universal-v2

      - name: Build Debug APK
        working-directory: android
        env:
          GSTREAMER_ROOT_ANDROID: ${{ env.GST_SDK_DIR }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          # Ensure Gradle wrapper jar exists
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper jar..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          
          ./gradlew assembleDebug --stacktrace -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" -PGSTREAMER_ROOT_ANDROID="${{ env.GST_SDK_DIR }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gst-launcher-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
